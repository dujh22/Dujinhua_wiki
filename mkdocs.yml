site_name: Jinhua Du | 杜晋华
site_url: https://dujh22.github.io/Dujinhua_wiki/
repo_url: https://github.com/dujh22/Dujinhua_wiki
repo_name: dujh22/Dujinhua_wiki
edit_uri: ""
site_description: 个人学术主页 - 研究、教育、发表、荣誉
site_author: Jinhua Du (杜晋华)

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/account-school-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - English:
      - Profile: index.md
      - Postgraduate Experience: postgraduate_experience_en.md
      - Undergraduate Experience: undergraduate_experience_en.md
      - Research History: history_en.md
  - 中文:
      - 个人简介: index_zh.md
      - 博士经历: postgraduate_experience_zh.md
      - 本科经历: undergraduate_experience_zh.md
      - 研究历史: history_zh.md
hooks:
  - hooks.py

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid_init.js

extra:
  meta:
    - name: keywords
      content: "大语言模型, 逻辑推理, 数学推理, 预训练, RLHF, 评测, 智谱AI, 研究实习, LLM, Large Language Models, Reasoning, Evaluation"
    - property: og:title
      content: "Jinhua Du | 杜晋华 — 智谱AI研究实习项目报告集"
    - property: og:description
      content: "智谱AI研究实习项目报告集，涵盖大模型预训练、逻辑推理、数学推理、评测方法论等30个项目；个人学术主页（研究、教育、发表、荣誉）。"
    - property: og:type
      content: website
    - property: og:url
      content: https://dujh22.github.io/Dujinhua_wiki/
    - property: og:site_name
      content: "Jinhua Du | 杜晋华"
    - property: og:locale
      content: zh_CN
    - name: twitter:card
      content: summary_large_image
    - name: twitter:title
      content: "Jinhua Du | 杜晋华 — 智谱AI研究实习项目报告集"
    - name: twitter:description
      content: "智谱AI研究实习项目报告集，涵盖大模型预训练、逻辑推理、数学推理、评测方法论等30个项目。"
    - name: author
      content: "Jinhua Du (杜晋华)"
    - name: robots
      content: index, follow
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # [请补充GA ID] 替换为您的Google Analytics 4衡量ID
